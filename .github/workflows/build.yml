name: Build WARP-in-WARP subscription

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Outer WARP edge country (ISO code, e.g. US/JP/SG/DE)"
        required: true
        default: "US"
      outer_proto:
        description: "Outer tunnel protocol"
        required: true
        type: choice
        options:
          - awg
          - wg
        default: awg
      inner_proto:
        description: "Inner tunnel protocol"
        required: true
        type: choice
        options:
          - wg
          - awg
        default: wg
      tun_ping:
        description: "Measure tunnel ping/loss while selecting endpoints"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: warp-in-warp
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download latest warpscout
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/vernette/warpscout/releases/latest"
          URL="$(curl -fsSL "$API" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          xs=[x["browser_download_url"] for x in d["assets"]
              if x["name"].endswith("linux_amd64.tar.gz")]
          print(xs[0] if xs else "")
          ')"
          test -n "$URL"
          curl -fL "$URL" -o /tmp/warpscout.tgz
          mkdir -p /tmp/warpscout
          tar -xzf /tmp/warpscout.tgz -C /tmp/warpscout
          BIN="$(find /tmp/warpscout -type f -name warpscout -perm -111 | head -n1)"
          test -n "$BIN"
          sudo install -m 0755 "$BIN" /usr/local/bin/warpscout
          warpscout version

      - name: Register fresh WARP account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          warpscout register

      - name: Pick outer WARP endpoint
        shell: bash
        env:
          COUNTRY: ${{ inputs.country }}
          OUTER_PROTO: ${{ inputs.outer_proto }}
          TUNPING: ${{ inputs.tun_ping }}
        run: |
          set -euo pipefail
          cd work
          ARGS=(scan -p "$OUTER_PROTO" -country "$COUNTRY" -best -no-report)
          if [ "$TUNPING" = "true" ]; then
            ARGS+=( -P )
          fi

          echo "Selecting outer endpoint for country: $COUNTRY"
          OUTER="$(warpscout "${ARGS[@]}" 2>outer-scan.log | tail -n1 | tr -d '\r')"

          if ! printf '%s' "$OUTER" | grep -Eq '^[0-9a-fA-F:.]+\:[0-9]+$'; then
            echo "Could not obtain a valid outer endpoint."
            cat outer-scan.log || true
            exit 1
          fi

          echo "Outer endpoint: $OUTER"
          printf '%s\n' "$OUTER" > outer.txt

      - name: Build WARP-in-WARP Mihomo YAML
        shell: bash
        env:
          OUTER_PROTO: ${{ inputs.outer_proto }}
          INNER_PROTO: ${{ inputs.inner_proto }}
        run: |
          set -euo pipefail
          cd work
          OUTER="$(cat outer.txt)"

          # warpscout's current WARP-in-WARP implementation supports
          # wg/awg for the nested tunnel. The outer tunnel is the one
          # crossing the runner's network; the inner tunnel is scanned through it.
          warpscout scan \
            -p "$OUTER_PROTO" \
            -inner-proto "$INNER_PROTO" \
            -through "$OUTER" \
            -best \
            -no-report \
            -conf ../configs/warp-in-warp.yaml \
            -conf-type mihomo

          test -s ../configs/warp-in-warp.yaml

      - name: Wrap YAML as subscription file
        shell: bash
        run: |
          set -euo pipefail
          cp configs/warp-in-warp.yaml configs/warp-in-warp.txt

          cat > configs/README.txt <<EOF
WARP-in-WARP subscription

GitHub Raw:
https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/configs/warp-in-warp.txt

jsDelivr CDN:
https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/configs/warp-in-warp.txt

Generated by GitHub Actions.
EOF

      - name: Validate basic Mihomo structure
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^proxies:' configs/warp-in-warp.yaml
          grep -q 'dialer-proxy:' configs/warp-in-warp.yaml
          grep -q 'type: wireguard' configs/warp-in-warp.yaml || \
            grep -q 'type: awg' configs/warp-in-warp.yaml

      - name: Commit generated subscription
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/warp-in-warp.yaml configs/warp-in-warp.txt configs/README.txt
          if git diff --cached --quiet; then
            echo "No generated-file changes."
          else
            git commit -m "Update WARP-in-WARP subscription"
            git push
          fi

      - name
