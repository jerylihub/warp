name: Build WARP-in-WARP subscription

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Outer WARP edge country (ISO code, e.g. US/JP/SG/DE)"
        required: true
        default: "US"

      outer_proto:
        description: "Outer tunnel protocol"
        required: true
        type: choice
        options:
          - awg
          - wg
        default: awg

      inner_proto:
        description: "Inner tunnel protocol"
        required: true
        type: choice
        options:
          - wg
          - awg
        default: wg

      tun_ping:
        description: "Measure tunnel ping/loss while selecting endpoints"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: warp-in-warp
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download latest warpscout
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/vernette/warpscout/releases/latest"

          URL="$(
            curl -fsSL "$API" | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assets = [
              x["browser_download_url"]
              for x in data["assets"]
              if x["name"].endswith("linux_amd64.tar.gz")
          ]

          print(assets[0] if assets else "")
          '
          )"

          test -n "$URL"

          echo "Downloading:"
          echo "$URL"

          curl -fL "$URL" -o /tmp/warpscout.tgz

          mkdir -p /tmp/warpscout

          tar -xzf /tmp/warpscout.tgz -C /tmp/warpscout

          BIN="$(find /tmp/warpscout -type f -name warpscout -perm -111 | head -n1)"

          test -n "$BIN"

          sudo install -m 0755 "$BIN" /usr/local/bin/warpscout

          warpscout version

      - name: Register fresh WARP account
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work

          cd work

          warpscout register

      - name: Pick outer WARP endpoint
        shell: bash
        env:
          COUNTRY: ${{ inputs.country }}
          OUTER_PROTO: ${{ inputs.outer_proto }}
          TUNPING: ${{ inputs.tun_ping }}
        run: |
          set -euo pipefail

          cd work

          ARGS=(
            scan
            -p "$OUTER_PROTO"
            -country "$COUNTRY"
            -best
            -no-report
          )

          if [ "$TUNPING" = "true" ]; then
            ARGS+=( -P )
          fi

          echo "Selecting outer endpoint..."
          echo "Country: $COUNTRY"
          echo "Protocol: $OUTER_PROTO"

          OUTER="$(
            warpscout "${ARGS[@]}" \
              2>outer-scan.log |
              tail -n1 |
              tr -d '\r'
          )"

          if ! printf '%s' "$OUTER" | grep -Eq '^[0-9a-fA-F:.]+:[0-9]+$'; then
            echo "ERROR: Could not obtain a valid outer endpoint."

            echo "===== warpscout log ====="

            cat outer-scan.log || true

            exit 1
          fi

          echo "Outer endpoint:"
          echo "$OUTER"

          printf '%s\n' "$OUTER" > outer.txt

            - name: Build WARP-in-WARP Mihomo YAML
        shell: bash
        env:
          OUTER_PROTO: ${{ inputs.outer_proto }}
          INNER_PROTO: ${{ inputs.inner_proto }}
        run: |
          set -euo pipefail

          cd work

          OUTER="$(cat outer.txt)"

          echo "Building WARP-in-WARP configuration..."
          echo "Through: $OUTER ($OUTER_PROTO)"
          echo "Inner protocol: $INNER_PROTO"

          warpscout scan \
            -p "$OUTER_PROTO" \
            -inner-proto "$INNER_PROTO" \
            -through "$OUTER" \
            -best \
            -no-report \
            -conf ../configs/warp-in-warp.yaml \
            -conf-type mihomo

          test -s ../configs/warp-in-warp.yaml

          echo "Mihomo configuration generated successfully.""

      - name: Create subscription file
        shell: bash
        run: |
          set -euo pipefail

          test -s configs/warp-in-warp.yaml

          cp \
            configs/warp-in-warp.yaml \
            configs/warp-in-warp.txt

          printf '%s\n' \
            'WARP-in-WARP subscription' \
            '' \
            'GitHub Raw:' \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/configs/warp-in-warp.txt" \
            '' \
            'jsDelivr CDN:' \
            "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/configs/warp-in-warp.txt" \
            '' \
            'Generated by GitHub Actions.' \
            > configs/README.txt

          echo "Subscription files created."

      - name: Validate Mihomo configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated configuration..."

          test -s configs/warp-in-warp.yaml

          grep -q '^proxies:' \
            configs/warp-in-warp.yaml

          grep -q 'dialer-proxy:' \
            configs/warp-in-warp.yaml

          if grep -q 'type: wireguard' configs/warp-in-warp.yaml; then
            echo "WireGuard proxy found."
          elif grep -q 'type: wireguard' configs/warp-in-warp.txt; then
            echo "WireGuard proxy found in subscription file."
          else
            echo "ERROR: WireGuard proxy not found."
            exit 1
          fi

          echo "Mihomo configuration validation passed."

      - name: Show generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Generated files ====="

          ls -lh configs/

          echo "===== Configuration summary ====="

          grep -E '^[[:space:]]*(- name:|name:|type:|server:|port:|dialer-proxy:)' \
            configs/warp-in-warp.yaml || true

      - name: Commit generated subscription
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            configs/warp-in-warp.yaml \
            configs/warp-in-warp.txt \
            configs/README.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: update WARP-in-WARP subscription"

          git push
